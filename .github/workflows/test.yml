name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.x"]
        include:
          - os: ubuntu-22.04
            python: "3.8"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: azure/setup-kubectl@v4
      - run: python -m unittest discover -s tests -v

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RAW: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4

      - name: make install / uninstall
        if: runner.os != 'Windows'
        run: |
          make install PREFIX="$RUNNER_TEMP/local"
          "$RUNNER_TEMP/local/bin/kubeadd" --version
          make uninstall PREFIX="$RUNNER_TEMP/local"
          test ! -e "$RUNNER_TEMP/local/bin/kubeadd"
      - name: curl | sh
        if: runner.os != 'Windows' && github.event_name == 'push'
        run: |
          curl -fsSL "$RAW/install.sh" | KUBEADD_VERSION="$GITHUB_SHA" sh
          "$HOME/.local/bin/kubeadd" --version

      - name: install.ps1 from checkout (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\install.ps1
          & "$env:LOCALAPPDATA\Programs\kubeadd\kubeadd.cmd" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\install.ps1 -Uninstall
          if (Test-Path "$env:LOCALAPPDATA\Programs\kubeadd") { exit 1 }
      - name: irm | iex (PowerShell 7)
        if: runner.os == 'Windows' && github.event_name == 'push'
        shell: pwsh
        run: |
          $env:KUBEADD_VERSION = $env:GITHUB_SHA
          irm "$env:RAW/install.ps1" | iex
          kubeadd --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
